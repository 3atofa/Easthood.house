<!-- =====================================================
     MODAL SHELL
     Fixed viewport overlay. The panel is a flex column
     capped at the viewport height so only the body scrolls.
====================================================== -->

<div
  class="fixed inset-0 z-[200] flex items-end justify-center sm:items-center sm:p-6"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="title"
>

  <!-- BACKDROP -->
  <div
    class="absolute inset-0 bg-black/70 backdrop-blur-sm"
    (click)="dismiss()"
    aria-hidden="true"
  ></div>


  <!-- PANEL -->
  <div
    class="relative flex max-h-[92vh] w-full flex-col overflow-hidden
           border border-white/10 bg-[#131316] text-[#f2eee8] shadow-2xl
           rounded-t-2xl sm:max-h-[86vh] sm:rounded-lg"
    [class]="widthClass"
  >

    <!-- Grab handle, phones only -->
    <div class="flex justify-center pt-3 sm:hidden" aria-hidden="true">
      <span class="h-1 w-10 rounded-full bg-white/20"></span>
    </div>


    <!-- ===============================================
         HEADER — fixed
    ================================================ -->

    <header class="flex shrink-0 items-start gap-4 border-b border-white/10 px-5 py-4 sm:px-6 sm:py-5">

      <span class="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-white/15 text-[12px] text-[#e85b17]">
        <i class="fa-solid" [class]="icon"></i>
      </span>

      <div class="min-w-0 flex-1">

        <h2 class="truncate text-[15px] font-medium tracking-[-0.01em]">
          {{ title }}
        </h2>

        @if (subtitle) {
          <p class="mt-1 text-[12px] leading-relaxed text-white/45">
            {{ subtitle }}
          </p>
        }

      </div>

      <button
        type="button"
        (click)="dismiss()"
        [disabled]="busy"
        aria-label="Close"
        class="-mr-1 flex h-8 w-8 shrink-0 items-center justify-center rounded-full
               text-[13px] text-white/45 transition-colors duration-200
               hover:bg-white/5 hover:text-white
               disabled:cursor-not-allowed disabled:opacity-40"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>

    </header>


    <!-- ===============================================
         BODY — the only scrolling region
    ================================================ -->

    <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-5 py-5 sm:px-6">
      <ng-content select="[modal-body]"></ng-content>
    </div>


    <!-- ===============================================
         FOOTER — fixed, sits below the safe area
    ================================================ -->

    <footer class="shrink-0 border-t border-white/10 bg-[#131316] px-5 py-4 pb-[max(1rem,env(safe-area-inset-bottom))] sm:px-6">
      <ng-content select="[modal-footer]"></ng-content>
    </footer>

  </div>

</div>
