# ============================================================
# EAST HOOD — nginx serving contract
#
# nginx decides what a crawler actually receives, so these rules
# come before anything in the app.
#
# Location precedence, which every block below depends on:
#   exact "="  ->  longest literal prefix  ->  FIRST matching regex
#   in file order  ->  prefix fallback
#
# Regex blocks are therefore order-sensitive. Narrow ones first.
# `nginx -t` proves syntax, never behaviour — verify with curl.
# ============================================================

upstream easthood_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# The Angular SSR process (dist/frontend/server/server.mjs).
upstream easthood_ssr {
    server 127.0.0.1:4000;
    keepalive 32;
}


# ---- canonicalise the host: one origin, everything else 301s ----
server {
    listen 80;
    listen [::]:80;
    server_name easthood.house www.easthood.house;

    return 301 https://easthood.house$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.easthood.house;

    ssl_certificate     /etc/letsencrypt/live/easthood.house/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easthood.house/privkey.pem;

    return 301 https://easthood.house$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name easthood.house;

    ssl_certificate     /etc/letsencrypt/live/easthood.house/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easthood.house/privkey.pem;

    root /var/www/easthood/frontend/dist/frontend/browser;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


    # ========================================================
    # 1. THE LIVE SITEMAP AND ROBOTS
    #
    # Exact matches, so they beat the data-file regex below AND
    # the SSR fallback. Generated from the database, so a newly
    # published article is announced immediately.
    #
    # If a stale sitemap.xml ever appears in the build output it
    # is DEAD — nginx never serves it. Delete it rather than
    # letting someone "fix SEO" by editing a file nobody reads.
    # ========================================================

    location = /sitemap.xml {
        proxy_pass http://easthood_api/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /robots.txt {
        proxy_pass http://easthood_api/api/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # ========================================================
    # 2. DATA FILES 404 HONESTLY
    #
    # Without this, a request for a file that does not exist —
    # /sitemap_index.xml, say — falls through to the SPA
    # fallback and returns an HTML page with HTTP 200. That is
    # a soft 404: Google indexes phantom URLs and any client
    # expecting XML gets HTML with no way to know.
    #
    # Verify:
    #   curl -o /dev/null -w '%{http_code}' \
    #        https://easthood.house/does-not-exist.xml   -> 404
    # ========================================================

    location ~* \.(xml|txt|json|map)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }


    # ---- API and uploads, before any rewrite touches them ----
    location /api/ {
        proxy_pass http://easthood_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/easthood/backend/uploads/;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }


    # ========================================================
    # 3. ONE CANONICAL URL SHAPE
    #
    # No trailing slash. Two URLs serving identical content is
    # how a site earns "Duplicate without user-selected
    # canonical" in Search Console.
    #
    # The negative lookahead matters: /api/ and /uploads/ must
    # not be rewritten.
    # ========================================================

    location ~ ^(?!/api/|/uploads/)(?<noslash>.+)/$ {
        return 301 https://$host/$noslash;
    }


    # ========================================================
    # 4. PERMANENT REDIRECTS FOR RENAMED URLS
    #
    # A slug change must 301 — a client-side redirect is not a
    # 301 and counts for far less.
    #
    # Past a handful of these, move them into a database table
    # with a middleware lookup, so a merged article does not
    # need a deploy.
    # ========================================================

    # location = /articles/old-slug { return 301 https://easthood.house/articles/new-slug; }


    # ---- hashed build assets are immutable ----
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @ssr;
    }


    # ========================================================
    # 5. EVERYTHING ELSE GOES TO SSR
    #
    # Not `try_files $uri $uri/ /index.html`. That is the
    # defining bug of SPA hosting: it answers every unmatched
    # path with the shell and HTTP 200.
    #
    # The SSR process renders the real page — title, canonical,
    # JSON-LD and body text — so a crawler that does not run
    # JavaScript still receives the content.
    # ========================================================

    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://easthood_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        # A crawler must never be served a stale render of a page
        # that was just republished.
        proxy_cache_bypass $http_upgrade;
    }


    # The admin portal is not content. Keep it out of the index
    # even if something links to it.
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri @ssr;
    }
}
